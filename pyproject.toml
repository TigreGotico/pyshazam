[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyshazam"
version = "0.1.0"
description = "A modular, async Python client for the Shazam API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "TigreGotico"},
]
dependencies = [
    "aiohttp>=3.8",
    "shazamio-core>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["pyshazam"]
