[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shazampy"
dynamic = ["version"]
description = "A modular, async Python client for the Shazam API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "TigreGotico"},
]
dependencies = [
    "aiohttp>=3.8",
    "shazamio-core>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://github.com/TigreGotico/shazampy"
Repository = "https://github.com/TigreGotico/shazampy"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["shazampy*"]

[tool.setuptools.dynamic]
version = {attr = "shazampy.version.__version__"}
