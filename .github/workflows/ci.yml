name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Run integration tests
        env:
          PYSHAZAM_TEST_AUDIO: ""
        run: |
          pytest tests/ -v || true
      - name: Check imports
        run: |
          python -c "from pyshazam import ShazamClient, ShazamTransport, ShazamScraper; print('imports OK')"
